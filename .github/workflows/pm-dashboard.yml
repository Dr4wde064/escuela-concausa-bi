name: PM Dashboard

# Revisión obligatoria: Célula 5 (Cloud & DevOps).
# Genera un artefacto descargable; no hace commit ni push directo a main.
on:
  pull_request:
    branches: [main]
    paths:
      - '02_Requirements/**'
      - '05_Engineering/Definition_of_Done.md'
      - '10_Risk_Governance/**'
      - '12_Roadmap_Sprints/**'
      - '13_Reports/**'
      - '14_Data_Sources/**'
      - '_Meta/scripts/*pm_dashboard.py'
      - '_Meta/scripts/collect_github_activity.py'
      - '.github/workflows/pm-dashboard.yml'
  push:
    branches: [main]
    paths:
      - '02_Requirements/**'
      - '10_Risk_Governance/**'
      - '12_Roadmap_Sprints/**'
      - '13_Reports/**'
      - '14_Data_Sources/**'
      - '_Meta/scripts/*pm_dashboard.py'
      - '_Meta/scripts/collect_github_activity.py'
  schedule:
    - cron: '15 13 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: pm-dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-dashboard:
    name: Generar y validar tablero PM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Recopilar actividad agregada de GitHub
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 _Meta/scripts/collect_github_activity.py

      - name: Generar tablero desde fuentes canónicas
        run: python3 _Meta/scripts/generate_pm_dashboard.py .

      - name: Validar contrato del tablero
        run: python3 _Meta/scripts/validate_pm_dashboard.py .

      - name: Validar salud del vault
        run: python3 _Meta/scripts/vault_lint.py .

      - name: Publicar tablero auditable
        uses: actions/upload-artifact@v4
        with:
          name: faro-pm-dashboard-${{ github.run_number }}
          path: |
            13_Reports/TABLERO_CONTROL_PM.html
            13_Reports/data/pm-dashboard.json
            13_Reports/data/pm-dashboard-history.json
            13_Reports/data/github-activity.json
          if-no-files-found: error
          retention-days: 30
